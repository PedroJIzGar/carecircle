server:
  port: ${SERVER_PORT:8080}
  servlet:
    context-path: /api

spring:
  config:
    import: optional:file:.env[.properties]
  application:
    name: carecircle-api
  datasource:
    url: jdbc:postgresql://${DB_HOST}:${DB_PORT}/${DB_NAME}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true
    locations: classpath:db/migration

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: never

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html

carecircle:
  supabase:
    project-url: ${SUPABASE_PROJECT_URL}
    issuer: ${SUPABASE_ISSUER}
    jwks-uri: ${SUPABASE_JWKS_URI}
    audience: ${SUPABASE_AUDIENCE}
